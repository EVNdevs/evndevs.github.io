# Deploys this repository's files to GitHub Pages as they are (the site is generated by the firmware repository's
# vscode-evn-alpha/scripts/publish_public.py and pushed by tools/release_public.py; .nojekyll: no Jekyll build).
# Added 2026-11-09 (owner: switch the Pages source to a workflow) after the legacy "deploy from a branch" backend
# failed three deploys of release 0.2.75 (3ddc87f) with no status. publish_public.py never clears .github/.
name: Deploy site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
